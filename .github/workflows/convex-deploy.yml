name: Deploy Convex

# ──────────────────────────────────────────────────────────────────────
# Deploys Convex functions to production ONLY when files inside the
# convex/ folder actually change. Two layers of protection:
#
#   1. `paths` filter — GitHub won't even start the workflow unless
#      the push includes changes under convex/.
#   2. `detect-changes` job — compares the commit diff to confirm
#      convex/ was modified. This catches edge cases like merge
#      commits or manual workflow_dispatch where no convex code changed.
#
# The deploy job is skipped entirely if no convex changes are detected.
# ──────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master]
    paths:
      - "convex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: Verify convex/ actually has changes ──────────────────────
  detect-changes:
    name: Check for Convex changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      convex_changed: ${{ steps.filter.outputs.convex_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes in convex/
        id: filter
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^convex/'; then
            echo "convex_changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Changes detected in convex/"
          else
            echo "convex_changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  No changes in convex/ — deploy will be skipped"
          fi

  # ── Step 2: Deploy only if convex/ changed ───────────────────────────
  deploy:
    name: Deploy to Convex Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.convex_changed == 'true'

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex types
        run: bunx convex codegen

      - name: Deploy to Convex
        run: bunx convex deploy
