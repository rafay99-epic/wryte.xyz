name: Deploy Convex

# ──────────────────────────────────────────────────────────────────────
# Deploys Convex functions to production when anything that affects the
# deployed backend changes. That includes:
#
#   - convex/**         — backend source
#   - package.json      — declares dependencies + patchedDependencies
#   - bun.lock          — pins exact versions (incl. patched packages)
#   - patches/**        — local bun patches that bun install re-applies
#
# Two layers of protection:
#   1. `paths` filter — GitHub won't even start the workflow unless one
#      of those paths is touched.
#   2. `detect-changes` job — re-checks the diff for the same patterns
#      to catch merge commits / workflow_dispatch with no real change.
#
# The deploy job is skipped if none of the watched paths actually
# changed in the commit (and not skipped when triggered manually via
# workflow_dispatch — we honour the manual intent).
# ──────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master]
    paths:
      - "convex/**"
      - "package.json"
      - "bun.lock"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: Verify convex/ actually has changes ──────────────────────
  detect-changes:
    name: Check for Convex changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      convex_changed: ${{ steps.filter.outputs.convex_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy-relevant changes
        id: filter
        run: |
          # Manual workflow_dispatch always counts as a deploy intent.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "convex_changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Manual workflow_dispatch — deploy will run"
            exit 0
          fi

          # Otherwise look for changes that affect the deployed backend:
          # convex source, package.json, bun.lock, or any local bun patch.
          if git diff --name-only HEAD~1 HEAD \
              | grep -Eq '^(convex/|package\.json$|bun\.lock$|patches/)'; then
            echo "convex_changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Deploy-relevant changes detected"
          else
            echo "convex_changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  No deploy-relevant changes — deploy will be skipped"
          fi

  # ── Step 2: Deploy only if convex/ changed ───────────────────────────
  deploy:
    name: Deploy to Convex Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.convex_changed == 'true'

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex types
        run: bunx convex codegen

      - name: Deploy to Convex
        run: bunx convex deploy
