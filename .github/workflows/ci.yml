name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Build-time placeholders so `next build` succeeds without secrets (see src/lib/convex.ts, Clerk).
  NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
  CLERK_SECRET_KEY: sk_test_ci_placeholder

jobs:
  quality-and-build:
    name: Lint, types, audit & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (lint + format check)
        run: bun run lint

      - name: TypeScript
        run: bun run type

      - name: Dependency audit
        run: bun audit

      - name: Production build
        run: bunx next build
