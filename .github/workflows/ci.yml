name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Build-time placeholders so `next build` succeeds without secrets (see src/lib/convex.ts, Clerk).
  NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
  CLERK_SECRET_KEY: sk_test_ci_placeholder

jobs:
  quality-and-build:
    name: Lint, types, audit & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (lint + format check)
        run: bun run lint

      - name: TypeScript
        run: bun run type

      - name: Dependency audit
        # GHSA-gv7w-rqvm-qjhr: esbuild <0.28.1, pulled in transitively and
        # hard-pinned by convex (convex@1.41 still pins esbuild@0.27.0). The
        # advisory is a build-time RCE that requires a hostile NPM_CONFIG_REGISTRY
        # — not applicable to our trusted CI/Vercel registries — and the patched
        # esbuild@0.28.1 is currently blocked by our minimumReleaseAge guard.
        # Remove this ignore once convex ships a release pinning esbuild >=0.28.1.
        run: bun audit --ignore GHSA-gv7w-rqvm-qjhr

      - name: Production build
        run: bunx next build
