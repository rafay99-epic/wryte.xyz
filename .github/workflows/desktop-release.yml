name: Desktop Release

# Builds the Electron desktop app (macOS .dmg, Windows .exe, Linux .AppImage)
# and publishes the artifacts to a GitHub Release. electron-updater reads that
# release (see package.json build.publish) to auto-update installed apps.
#
# Release the desktop app only — independent of the web app's SHA-based
# versioning. Push a semver tag to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag's version is injected into the build (extraMetadata), so the web
# app's package.json version is never touched.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tag pushes ignore `paths:` filters, so gate the paid 3-OS matrix here:
  # only build when the desktop app actually changed since the previous tag.
  detect:
    name: Detect desktop changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff desktop files vs previous tag
        id: check
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -z "$prev" ]; then
            echo "First tag — building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$prev" "${GITHUB_REF_NAME}" -- \
               electron build .github/workflows/desktop-release.yml | grep -q .; then
            echo "Desktop files changed since $prev — building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No desktop changes since $prev — skipping build (saves CI minutes)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Create ONE draft release up front. GitHub's get-release-by-tag skips drafts,
  # so without this each matrix job would create its own duplicate draft.
  prepare:
    name: Create draft release
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — reusing."
          else
            gh release create "${GITHUB_REF_NAME}" --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes "Wryte ${GITHUB_REF_NAME} desktop build." \
              --repo "${GITHUB_REPOSITORY}"
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: [detect, prepare]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Electron binary
        # bun skips postinstall for untrusted deps; download the binary explicitly.
        run: node node_modules/electron/install.js

      - name: Build and upload to draft release
        shell: bash
        env:
          # electron-builder uploads assets to a DRAFT release (releaseType in
          # package.json). GitHub immutable releases forbid uploading to an
          # already-published release, so the finalize job publishes it once all
          # platforms' assets are attached.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bunx electron-builder --publish always -c.extraMetadata.version="$VERSION"

  # After all platforms upload to the draft, publish it (freezing it under
  # immutable releases) and point the Homebrew tap at the now-public Wryte.dmg.
  finalize:
    name: Publish release + bump cask
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish the draft release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest --repo "${GITHUB_REPOSITORY}"

      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "No TAP_TOKEN secret — skipping cask bump."
            exit 0
          fi
          gh release download "${GITHUB_REF_NAME}" -p "Wryte.dmg" -D dist --repo "${GITHUB_REPOSITORY}"
          VERSION="${GITHUB_REF_NAME#v}" CASK=wryte \
            .github/scripts/bump-cask.sh dist/Wryte.dmg
