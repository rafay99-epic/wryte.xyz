<!doctype html>
<html lang="en" class="wryte-desktop-mac">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!--
      Broad by necessity (Clerk FAPI + Convex + user media all remote), still
      blocks file:// and unknown scheme navigation. Tighten per-domain once
      the Clerk FAPI host is pinned for production builds.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval'"
    />
    <title>Wryte</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
