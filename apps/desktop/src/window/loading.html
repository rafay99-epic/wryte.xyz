<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline';"
    />
    <title>Loading Wryte</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        -webkit-user-select: none;
        user-select: none;
        /* draggable so the loading window feels native under hiddenInset */
        -webkit-app-region: drag;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        animation: pulse 1.8s ease-in-out infinite;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid #1c1c1c;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../../assets/wryte-icon.png" alt="Wryte" />
    <div class="spinner"></div>
  </body>
</html>
