<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Software Update</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #ededed;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        width: 100%;
        text-align: center;
      }
      .icon {
        font-size: 34px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      p {
        font-size: 12.5px;
        color: #a1a1a1;
        line-height: 1.5;
      }
      .bar {
        height: 6px;
        background: #1f1f1f;
        border-radius: 99px;
        overflow: hidden;
        margin: 18px 0 8px;
      }
      .fill {
        height: 100%;
        width: 0%;
        background: #f59e0b;
        border-radius: 99px;
        transition: width 0.2s ease;
      }
      .meta {
        font-size: 11px;
        color: #6b6b6b;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        margin-top: 22px;
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button {
        font: inherit;
        font-size: 12.5px;
        font-weight: 500;
        padding: 7px 16px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: #161616;
        color: #ededed;
        cursor: pointer;
      }
      button.primary {
        background: #f59e0b;
        border-color: #f59e0b;
        color: #0a0a0a;
      }
      button:hover {
        filter: brightness(1.1);
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid #1f1f1f;
        border-top-color: #f59e0b;
        border-radius: 50%;
        margin: 0 auto 14px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="spinner" class="spinner hidden"></div>
      <div id="icon" class="icon hidden"></div>
      <h1 id="title">Checking for updates…</h1>
      <p id="msg"></p>
      <div id="progress" class="hidden">
        <div class="bar"><div id="fill" class="fill"></div></div>
        <div class="meta" id="pmeta"></div>
      </div>
      <div class="actions">
        <button type="button" id="install" class="primary hidden">
          Restart &amp; Install
        </button>
        <button type="button" id="close" class="hidden">Close</button>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const mb = (b) => `${(b / 1048576).toFixed(1)} MB`;
      const show = (el, on) => el.classList.toggle("hidden", !on);

      function render(s) {
        const els = ["spinner", "icon", "progress", "install", "close"].map($);
        for (const e of els) show(e, false);
        $("msg").textContent = "";

        switch (s.state) {
          case "checking":
            show($("spinner"), true);
            $("title").textContent = "Checking for updates…";
            break;
          case "downloading": {
            show($("progress"), true);
            $("title").textContent = `Downloading update${
              s.version ? ` v${s.version}` : ""
            }…`;
            const pct = Math.max(0, Math.min(100, Math.round(s.percent || 0)));
            $("fill").style.width = `${pct}%`;
            $("pmeta").textContent = s.total
              ? `${pct}%  ·  ${mb(s.transferred)} / ${mb(s.total)}`
              : `${pct}%`;
            break;
          }
          case "ready":
            show($("icon"), true);
            $("icon").textContent = "✅";
            $("title").textContent = "Update ready";
            $("msg").textContent = `Wryte v${
              s.version || ""
            } has been downloaded. Restart to install it.`;
            show($("install"), true);
            show($("close"), true);
            $("close").textContent = "Later";
            break;
          case "installing":
            show($("spinner"), true);
            $("title").textContent = "Installing…";
            $("msg").textContent = "The app will restart automatically.";
            break;
          case "none":
            show($("icon"), true);
            $("icon").textContent = "✨";
            $("title").textContent = "You’re up to date";
            show($("close"), true);
            $("close").textContent = "Close";
            break;
          case "dev":
            show($("icon"), true);
            $("icon").textContent = "🛠";
            $("title").textContent = "Development build";
            $("msg").textContent =
              "Updates are only available in installed builds.";
            show($("close"), true);
            $("close").textContent = "Close";
            break;
          case "error":
            show($("icon"), true);
            $("icon").textContent = "⚠️";
            $("title").textContent = "Update failed";
            $("msg").textContent = s.message || "Something went wrong.";
            show($("close"), true);
            $("close").textContent = "Close";
            break;
        }
      }

      window.wryteUpdater.onStatus(render);
      $("install").addEventListener("click", () => window.wryteUpdater.install());
      $("close").addEventListener("click", () => window.wryteUpdater.close());
    </script>
  </body>
</html>
